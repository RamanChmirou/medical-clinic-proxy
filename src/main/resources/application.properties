server.port=8081
spring.application.name=medical-clinic-proxy
spring.cloud.openfeign.client.config.medical-clinic-client.url=${MEDICAL_CLINIC_URL:http://localhost:8080}
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=4s

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always